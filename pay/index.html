<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Payments">
<meta name="theme-color" content="#111E3E">
<title>Vriddhi Fuels — Payments</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{
  --orange:#E46713; --orange-soft:#f0853a; --orange-tint:#fff1e6;
  --navy:#111E3E; --navy-2:#1a2c52;
  --bg:#f5f6f8; --bg-grad-top:#eef1f6;
  --card:#ffffff; --card-2:#fbfcfe;
  --line:#e7e9ee; --line-2:#eef0f4;
  --txt:#1c2430; --txt-2:#5b6573; --txt-3:#8b94a3;
  --pos:#c2410c; --neg:#0f9d6e; --warn:#b45309; --warn-bg:#fff7ed; --err:#e0524e;
  --radius:18px; --radius-sm:13px;
  --shadow:0 1px 2px rgba(17,30,62,.04), 0 6px 20px rgba(17,30,62,.06);
  --shadow-lg:0 4px 12px rgba(17,30,62,.08), 0 16px 40px rgba(17,30,62,.10);
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1320; --bg-grad-top:#121a2c;
    --card:#172033; --card-2:#1b2538;
    --line:#27324a; --line-2:#222c42;
    --txt:#eef2f8; --txt-2:#a7b1c4; --txt-3:#7b8499;
    --orange-tint:#2a1d12;
    --pos:#ff8a4c; --neg:#3fd29a; --warn:#f0a54a; --warn-bg:#2a1d12; --err:#ff6b66;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --shadow-lg:0 4px 12px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--txt);
  background:linear-gradient(180deg,var(--bg-grad-top),var(--bg) 240px);background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--orange);text-decoration:none}

/* Header */
header{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-2);padding:calc(var(--safe-top) + 12px) 16px 12px}
.hrow{display:flex;align-items:center;gap:11px;max-width:940px;margin:0 auto}
.brandmark{width:30px;height:30px;border-radius:8px;flex:none;object-fit:cover;box-shadow:0 1px 4px rgba(17,30,62,.18)}
.htitle{font-weight:700;font-size:18px;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);
  padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease}
.btn:hover{box-shadow:var(--shadow-lg)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.accent{background:linear-gradient(180deg,var(--orange-soft),var(--orange));border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(228,103,19,.35)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.status{font-size:12px;color:var(--txt-3);margin:8px auto 0;display:flex;align-items:center;gap:7px;max-width:940px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--txt-3);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--txt-3) 18%,transparent)}
.dot.ok{background:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent)}
.dot.err{background:var(--err);box-shadow:0 0 0 3px rgba(224,82,78,.2)}
.dot.load{background:var(--orange);box-shadow:0 0 0 3px rgba(228,103,19,.2);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

main{padding:16px 16px calc(var(--safe-bot) + 120px);max-width:940px;margin:0 auto}
.section-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-3);
  margin:24px 4px 12px;display:flex;align-items:center;gap:8px}
.section-label:first-child{margin-top:6px}
.section-label::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--orange);opacity:.7}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-3);font-weight:700;margin:0 2px 6px}
textarea,input,select{width:100%;background:var(--card-2);border:1px solid var(--line);color:var(--txt);
  padding:12px 13px;border-radius:11px;font-size:16px;outline:none;font-family:inherit;
  transition:border-color .15s, box-shadow .15s}
textarea{min-height:120px;resize:vertical;line-height:1.55;font-variant-numeric:tabular-nums}
textarea:focus,input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(228,103,19,.12)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.hint{font-size:12.5px;color:var(--txt-3);margin:8px 2px 0;line-height:1.5}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.formgrid .full{grid-column:1/-1}
.rowbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;background:var(--line-2);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;border:none;color:var(--txt-2);font-weight:600;font-size:13.5px;
  padding:9px;border-radius:9px;cursor:pointer;transition:all .15s}
.tabs button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow)}
.stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-3);font-weight:700}
.stat .val{font-size:20px;font-weight:750;margin-top:5px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat.hero{background:linear-gradient(135deg,var(--navy-2),var(--navy));border-color:transparent}
.stat.hero .lbl{color:rgba(255,255,255,.65)} .stat.hero .val{color:#fff}
.stat .val .unit{font-size:12px;font-weight:600;color:var(--txt-3)}

/* Table */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:max-content}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{position:sticky;top:0;background:var(--card-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-3);font-weight:700;z-index:2}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr.bad{background:color-mix(in srgb,var(--err) 8%,transparent)}
tbody tr.warnrow{background:color-mix(in srgb,var(--warn) 9%,transparent)}
td .cell-in{padding:7px 9px;font-size:13.5px;border-radius:8px;min-width:96px}
td .cell-in.amt{text-align:right;min-width:96px}
td select.cell-in{min-width:150px}
.resname{font-weight:650}
.rawnote{font-size:11px;color:var(--txt-3);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11.5px;padding:4px 9px;border-radius:20px;background:var(--orange-tint);border:1px solid color-mix(in srgb,var(--orange) 25%,transparent);color:var(--orange);font-weight:600;cursor:pointer}
.chip:hover{background:color-mix(in srgb,var(--orange) 18%,transparent)}
.pill{font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.pill.ok{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.pill.amb{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.no{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.pill.dup{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.mode{background:var(--line-2);color:var(--txt-2)}
.flagline{font-size:11.5px;color:var(--warn);margin-top:4px;font-weight:600}
.xbtn{background:transparent;border:none;color:var(--txt-3);font-size:16px;cursor:pointer;padding:4px 6px;border-radius:8px;line-height:1}
.xbtn:hover{background:var(--line-2);color:var(--err)}

.subtitle{color:var(--txt-2);font-size:13.5px;margin:0 2px 12px;font-weight:500}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 20px;text-align:center;color:var(--txt-3)}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none!important}
.empty{padding:34px 20px;text-align:center;color:var(--txt-3);font-size:14px}
.banner{border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;font-weight:500;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.banner.warn{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.banner.info{background:var(--card);border:1px solid var(--line);color:var(--txt-2);box-shadow:var(--shadow)}
.banner.good{background:color-mix(in srgb,var(--neg) 10%,transparent);border:1px solid color-mix(in srgb,var(--neg) 30%,transparent);color:var(--neg)}
.banner b{font-weight:700}

/* Sticky export bar */
.exportbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:12px 16px calc(var(--safe-bot) + 12px)}
.exportbar-in{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.exportbar .sum{flex:1;min-width:140px;font-size:13px;color:var(--txt-2)}
.exportbar .sum b{color:var(--txt);font-weight:750}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header>
  <div class="hrow">
    <img class="brandmark" src="icon.png" alt="Vriddhi Fuels">
    <div class="htitle">Payment Entry</div>
    <button class="btn accent sm" id="refreshBtn" onclick="loadNames(true)" title="Refresh customer list">↻ Names</button>
  </div>
  <div class="status"><span class="dot load" id="statusDot"></span><span id="statusText">Loading customer list…</span></div>
</header>

<main id="main">
  <!-- INPUT -->
  <div class="section-label">New payments</div>
  <div class="card">
    <div class="tabs">
      <button id="tabTextBtn" class="on" onclick="switchTab('text')">Paste lines</button>
      <button id="tabFormBtn" onclick="switchTab('form')">Form</button>
    </div>

    <div id="tabText">
      <label class="fl" for="bulk">One payment per line</label>
      <textarea id="bulk" class="mono" placeholder="pay 28/07/26 akv 60000 30000 UPI + 30000 HDFC&#10;pay 28/07/26 sudarshan 50000 HDFC 1010"></textarea>
      <div class="hint">Grammar: <b>pay</b> · date <span class="mono">dd/mm/yy</span> · customer · amount · mode.
        Names can be partial (e.g. <span class="mono">akv</span>, <span class="mono">smc</span>) — they're resolved to the full customer name below.</div>
      <div class="rowbtns">
        <button class="btn accent" onclick="parseTextarea()">Add to review ↓</button>
        <button class="btn ghost" onclick="fillSample()">Insert example</button>
      </div>
    </div>

    <div id="tabForm" class="hide">
      <div class="formgrid">
        <div><label class="fl" for="fDate">Date</label><input type="date" id="fDate"></div>
        <div><label class="fl" for="fAmount">Amount ₹</label><input type="text" id="fAmount" inputmode="decimal" placeholder="60000"></div>
        <div class="full"><label class="fl" for="fName">Customer</label>
          <input type="text" id="fName" list="allnames" placeholder="Type a name or partial…" autocomplete="off"></div>
        <div class="full"><label class="fl" for="fMode">Payment mode</label>
          <input type="text" id="fMode" placeholder="e.g. HDFC 1010  ·  30000 UPI + 30000 HDFC"></div>
      </div>
      <div class="rowbtns"><button class="btn accent" onclick="addFormRow()">Add to review ↓</button></div>
    </div>
  </div>

  <datalist id="allnames"></datalist>

  <!-- REVIEW + ANALYSIS -->
  <div id="reviewSection"></div>
</main>

<!-- Sticky export bar -->
<div class="exportbar hide" id="exportbar">
  <div class="exportbar-in">
    <div class="sum" id="exportSum"></div>
    <button class="btn ghost sm" onclick="clearBatch()">Clear</button>
    <button class="btn sm" onclick="exportCsv()">CSV</button>
    <button class="btn accent" id="xlsxBtn" onclick="exportXlsx()">Export .xlsx →</button>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   Vriddhi Fuels — Payment Entry
   Parses "pay ..." lines / form entries, resolves partial customer
   names against the live Master Paid customer list, and exports a
   clean .xlsx ready to append to the Master Paid sheet (Option A).
   ============================================================ */
const CFG = (window.VRIDDHI_PAY_CONFIG || {});
const NAMES_CACHE_KEY = "vriddhi_pay_names";
const SEEN_KEY = "vriddhi_pay_seen";

let NAMES = [];            // canonical display names, sorted
let NORMED = [];           // [ [name, norm], ... ]
let HIST = new Map();      // norm -> {count,total,amts:[]}  (historical amounts per customer)
let namesSource = "none";  // 'live' | 'cache' | 'none'

let ROWS = [];             // batch of entries
let rowSeq = 1;

/* ---------------- Parser (ported from the reference Python) ---------------- */
function parsePay(text){
  let body = String(text).trim();
  if(!body.toLowerCase().startsWith("pay")) return {err:"not a pay message"};
  body = body.slice(3).trim();
  const m = body.match(/^(\d{1,2}\/\d{1,2}\/\d{2,4})\s+([\s\S]*)$/);
  if(!m) return {err:"missing or invalid date"};
  const dateStr = m[1], rest = m[2];
  const am = rest.match(/(?<!\S)(\d[\d,]*(?:\.\d+)?)(?!\S)/);
  if(!am) return {err:"no amount found"};
  const name = rest.slice(0, am.index).trim();
  const amount = am[1].replace(/,/g, "");
  const mode = rest.slice(am.index + am[0].length).trim();
  if(!name) return {err:"no customer name"};
  return {dateStr, name, amount, mode};
}

/* ---------------- Date <-> Excel serial ---------------- */
const EPOCH = Date.UTC(1899, 11, 30);   // 1899-12-30
function toSerial(dateStr){
  const p = dateStr.split("/").map(x => parseInt(x, 10));
  let [d, m, y] = p;
  if(y < 100) y += 2000;
  if(!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 1900 && y < 3000)) return {serial:null, valid:false};
  const t = Date.UTC(y, m - 1, d);
  const dt = new Date(t);
  if(dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return {serial:null, valid:false};
  return {serial: Math.round((t - EPOCH) / 86400000), valid:true};
}
function serialToDMY(serial){
  const d = new Date(EPOCH + serial * 86400000);
  return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${String(d.getUTCFullYear()).slice(-2)}`;
}

/* ---------------- Name matcher (ported from the reference Python) ---------------- */
function _norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function matchName(raw){
  const q = _norm(raw), qc = q.replace(/ /g, "");
  for(const [n, nn] of NORMED){ if(nn === q) return {exact:n, list:[n]}; }
  const hit = nn => {
    if(qc && nn.replace(/ /g, "").includes(qc)) return true;
    if(qc) return nn.split(" ").some(w => w.startsWith(qc));
    return false;
  };
  const subs = NORMED.filter(([, nn]) => hit(nn)).map(([n]) => n);
  if(subs.length === 1) return {exact:subs[0], list:subs};
  if(subs.length > 1)  return {exact:null, list:subs};
  const words = new Set(q.split(" ").filter(Boolean));
  const scored = [];
  for(const [n, nn] of NORMED){
    const nw = new Set(nn.split(" ").filter(Boolean));
    let ov = 0; for(const w of words) if(nw.has(w)) ov++;
    if(ov) scored.push([ov, n]);
  }
  scored.sort((a, b) => b[0] - a[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0));
  return {exact:null, list: scored.slice(0, 6).map(x => x[1])};
}

/* ---------------- Payment-mode classification ---------------- */
function modeClass(mode){
  const s = (mode || "").toLowerCase();
  if(!s.trim()) return "Unspecified";
  const tags = [];
  if(/\bupi\b|phonepe|gpay|g ?pay|google ?pay|paytm|bhim|\bqr\b/.test(s)) tags.push("UPI");
  if(/hdfc|icici|sbi|axis|kotak|idfc|yes ?bank|\bbob\b|\bpnb\b|canara|union|indusind|rtgs|neft|imps|\bbank\b|a\/c|acct|account|transfer/.test(s)) tags.push("Bank");
  if(/\bcash\b/.test(s)) tags.push("Cash");
  if(/\bchq\b|cheque|\bcheck\b/.test(s)) tags.push("Cheque");
  if(tags.length === 1) return tags[0];
  if(tags.length > 1)  return "Mixed";
  return "Other";
}

/* ---------------- Feed: build the canonical customer list ---------------- */
function buildFromFeed(j){
  const sheets = (j && j.sheets) || {};
  const nameMap = new Map();   // norm -> display (first seen wins)
  const hist = new Map();
  const add = (name) => {
    const nm = String(name == null ? "" : name).trim();
    if(!nm) return;
    const k = _norm(nm);
    if(k && !nameMap.has(k)) nameMap.set(k, nm);
  };
  const mp = sheets["Master Paid"];
  if(mp && mp.values){
    const v = mp.values;
    for(let i = 0; i < v.length; i++){
      const row = v[i] || [];
      if(row[5] != null && row[5] !== "") add(row[5]);          // column F: canonical list
      if(i >= 1){                                                // rows: B=customer, C=amount
        const cust = row[1], amt = row[2];
        if(cust != null && cust !== ""){
          add(cust);
          if(typeof amt === "number" && !isNaN(amt)){
            const k = _norm(cust);
            const h = hist.get(k) || {count:0, total:0, amts:[]};
            h.count++; h.total += amt; h.amts.push(amt); hist.set(k, h);
          }
        }
      }
    }
  }
  const out = sheets["Outstanding"];       // customer ledgers — every account name
  if(out && out.values){
    for(const row of out.values){
      const name = row[1], sheet = row[2];
      if(name && sheet && sheet !== "Ledger") add(name);
    }
  }
  const names = [...nameMap.values()].sort((a, b) => (_norm(a) < _norm(b) ? -1 : 1));
  return {names, hist: [...hist.entries()], ts: Date.now()};
}

function applyBuilt(built, source){
  NAMES = built.names || [];
  NORMED = NAMES.map(n => [n, _norm(n)]);
  HIST = new Map(built.hist || []);
  namesSource = source;
  // populate the <datalist> for the form autocomplete
  document.getElementById("allnames").innerHTML =
    NAMES.map(n => `<option value="${escAttr(n)}">`).join("");
  // re-resolve any rows already in the batch (list may have just arrived)
  for(const r of ROWS) resolveRow(r);
  recomputeAndRender();
}

function readCache(){
  try{ const s = localStorage.getItem(NAMES_CACHE_KEY); return s ? JSON.parse(s) : null; }
  catch(_){ return null; }
}
function writeCache(built){ try{ localStorage.setItem(NAMES_CACHE_KEY, JSON.stringify(built)); }catch(_){} }

async function loadNames(force){
  setStatus("load", "Loading customer list…");
  const cached = readCache();
  if(cached && cached.names && cached.names.length && namesSource !== "live"){
    applyBuilt(cached, "cache");
    setStatus("load", `Using ${cached.names.length} cached names — refreshing…`);
  }
  if(!CFG.DATA_URL){
    setStatus("err", "No DATA_URL configured (see config.js)");
    return;
  }
  try{
    const res = await fetch(CFG.DATA_URL + (force ? ("?_t=" + Date.now()) : ""), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if(j.error) throw new Error(j.error);
    const built = buildFromFeed(j);
    if(!built.names.length) throw new Error("no customer names in feed");
    writeCache(built);
    applyBuilt(built, "live");
    const t = j.updated ? new Date(j.updated).toLocaleString("en-GB") : new Date().toLocaleTimeString();
    setStatus("ok", `${built.names.length} customers · updated ${t}`);
  }catch(e){
    if(namesSource === "cache"){
      setStatus("err", `Offline — using ${NAMES.length} cached names (${e.message})`);
    }else{
      namesSource = "none";
      setStatus("err", `Couldn't load customer list: ${e.message}`);
      recomputeAndRender();
    }
  }
}
function setStatus(cls, txt){
  document.getElementById("statusDot").className = "dot " + (cls || "");
  document.getElementById("statusText").textContent = txt;
}

/* ---------------- Row model ---------------- */
function makeRow(parsed, raw){
  const r = {id: rowSeq++, raw: raw || "", rawName: parsed.name, amount: parsed.amount,
    amountNum: null, dateStr: parsed.dateStr, serial: null, dateValid: false,
    mode: parsed.mode || "", resolved: null, candidates: [], status: "nomatch",
    autoResolved: false, flags: {dupBatch:false, dupSeen:false, outlier:false}};
  resolveRow(r);
  return r;
}
function resolveRow(r){
  // date
  const sd = toSerial(r.dateStr);
  r.serial = sd.serial; r.dateValid = sd.valid;
  // amount
  const a = parseFloat(String(r.amount).replace(/,/g, ""));
  r.amountNum = (isNaN(a) ? null : a);
  // name
  if(!NAMES.length){ r.resolved = null; r.candidates = []; r.status = "pending"; return; }
  const mm = matchName(r.rawName);
  if(mm.exact){
    r.resolved = mm.exact; r.candidates = mm.list;
    r.autoResolved = (_norm(mm.exact) !== _norm(r.rawName));
    r.status = "ok";
  }else if(mm.list.length > 1){
    r.resolved = null; r.candidates = mm.list; r.status = "ambiguous";
  }else{
    r.resolved = null; r.candidates = mm.list; r.status = "nomatch";
  }
}

/* Historical-typical outlier check */
function isOutlier(normName, amountNum){
  const h = HIST.get(normName);
  if(!h || h.amts.length < 3 || !(amountNum > 0)) return false;
  const arr = [...h.amts].sort((a, b) => a - b);
  const med = arr[Math.floor(arr.length / 2)];
  if(med <= 0) return false;
  return amountNum > med * 6 || amountNum < med / 6;
}

function readSeen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY) || "{}"); }catch(_){ return {}; } }
function rowKey(r){ return `${r.serial}|${r.resolved ? _norm(r.resolved) : ""}|${r.amountNum}`; }

/* Recompute cross-row flags (duplicates within batch + against exported history) */
function recomputeFlags(){
  const seen = readSeen();
  const batchKeys = {};
  for(const r of ROWS){
    r.flags.dupBatch = false; r.flags.dupSeen = false; r.flags.outlier = false;
    if(r.status !== "ok" || !r.dateValid || !(r.amountNum > 0)) continue;
    const k = rowKey(r);
    batchKeys[k] = (batchKeys[k] || 0) + 1;
    if(seen[k]) r.flags.dupSeen = true;
    if(isOutlier(_norm(r.resolved), r.amountNum)) r.flags.outlier = true;
  }
  for(const r of ROWS){
    if(r.status === "ok" && r.dateValid && r.amountNum > 0 && batchKeys[rowKey(r)] > 1) r.flags.dupBatch = true;
  }
}

/* ---------------- Input handlers ---------------- */
function switchTab(which){
  const t = which === "form";
  document.getElementById("tabForm").classList.toggle("hide", !t);
  document.getElementById("tabText").classList.toggle("hide", t);
  document.getElementById("tabFormBtn").classList.toggle("on", t);
  document.getElementById("tabTextBtn").classList.toggle("on", !t);
}
function fillSample(){
  document.getElementById("bulk").value =
    "pay 28/07/26 akv 60000 30000 UPI + 30000 HDFC\npay 28/07/26 sudarshan 50000 HDFC 1010";
}
function parseTextarea(){
  const box = document.getElementById("bulk");
  const lines = box.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let added = 0, errs = [];
  for(const line of lines){
    const p = parsePay(line);
    if(p.err){ errs.push(`“${line}” — ${p.err}`); continue; }
    ROWS.push(makeRow(p, line)); added++;
  }
  if(added) box.value = errs.length ? lines.filter(l => parsePay(l).err).join("\n") : "";
  if(errs.length) alert("Couldn't parse " + errs.length + " line(s):\n\n" + errs.join("\n") +
    "\n\nThey've been left in the box so you can fix them.");
  recomputeAndRender();
}
function addFormRow(){
  const dv = document.getElementById("fDate").value;   // yyyy-mm-dd
  const name = document.getElementById("fName").value.trim();
  const amount = document.getElementById("fAmount").value.trim();
  const mode = document.getElementById("fMode").value.trim();
  if(!dv || !name || !amount){ alert("Date, customer and amount are required."); return; }
  const [y, m, d] = dv.split("-");
  const dateStr = `${d}/${m}/${y.slice(-2)}`;
  ROWS.push(makeRow({dateStr, name, amount, mode}, `pay ${dateStr} ${name} ${amount} ${mode}`.trim()));
  document.getElementById("fName").value = "";
  document.getElementById("fAmount").value = "";
  document.getElementById("fMode").value = "";
  recomputeAndRender();
}

/* Row edits from the review table */
function pickCand(id, name){
  const r = ROWS.find(x => x.id === id); if(!r) return;
  if(!name) return;
  r.resolved = name; r.status = "ok"; r.autoResolved = true;
  recomputeAndRender();
}
function overrideName(id, value){
  const r = ROWS.find(x => x.id === id); if(!r) return;
  const v = value.trim();
  if(!v){ r.rawName = ""; resolveRow(r); recomputeAndRender(); return; }
  // exact canonical name typed via the datalist?
  const exact = NAMES.find(n => _norm(n) === _norm(v));
  if(exact){ r.resolved = exact; r.status = "ok"; r.autoResolved = true; }
  else { r.rawName = v; resolveRow(r); }
  recomputeAndRender();
}
function setAmount(id, value){
  const r = ROWS.find(x => x.id === id); if(!r) return;
  r.amount = value;
  const a = parseFloat(String(value).replace(/,/g, ""));
  r.amountNum = isNaN(a) ? null : a;
  recomputeAndRender();
}
function setMode(id, value){ const r = ROWS.find(x => x.id === id); if(r){ r.mode = value; recomputeAndRender(); } }
function setDate(id, value){
  const r = ROWS.find(x => x.id === id); if(!r) return;
  r.dateStr = value; const sd = toSerial(value); r.serial = sd.serial; r.dateValid = sd.valid;
  recomputeAndRender();
}
function delRow(id){ ROWS = ROWS.filter(x => x.id !== id); recomputeAndRender(); }
function clearBatch(){ if(ROWS.length && confirm("Clear all " + ROWS.length + " row(s) from review?")){ ROWS = []; recomputeAndRender(); } }

/* ---------------- Rendering ---------------- */
function money(n){
  if(n == null || isNaN(n)) return "";
  return Math.abs(n).toLocaleString("en-IN", {maximumFractionDigits:2}) ;
}
function escHtml(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escAttr(s){ return escHtml(s).replace(/'/g, "&#39;"); }

function exportableRows(){ return ROWS.filter(r => r.status === "ok" && r.dateValid && r.amountNum > 0); }

function recomputeAndRender(){
  recomputeFlags();
  renderReview();
  renderExportBar();
}

function renderReview(){
  const host = document.getElementById("reviewSection");
  if(!ROWS.length){ host.innerHTML = ""; return; }

  let html = "";

  // Warnings banner (top of review)
  const probs = ROWS.filter(r => r.status !== "ok" || !r.dateValid || !(r.amountNum > 0)).length;
  const dups  = ROWS.filter(r => r.flags.dupBatch || r.flags.dupSeen).length;
  const outs  = ROWS.filter(r => r.flags.outlier).length;
  if(namesSource === "none"){
    html += `<div class="banner warn">⚠️ <span><b>Customer list unavailable.</b> Names can't be resolved right now — connect once to load them, or type exact names. You can still edit and export, but double-check spellings.</span></div>`;
  }
  const notes = [];
  if(probs) notes.push(`${probs} row(s) need attention`);
  if(dups)  notes.push(`${dups} possible duplicate(s)`);
  if(outs)  notes.push(`${outs} unusual amount(s)`);
  if(notes.length) html += `<div class="banner warn">⚠️ <span>${notes.join(" · ")}. Fix the flagged rows below before exporting.</span></div>`;

  // Review table
  html += `<div class="section-label">Review — ${ROWS.length} entr${ROWS.length===1?"y":"ies"}</div>`;
  html += `<div class="tablewrap"><table><thead><tr>
    <th>Status</th><th>Date</th><th>Customer</th><th class="num">Amount ₹</th><th>Mode</th><th></th></tr></thead><tbody>`;
  for(const r of ROWS){
    const bad = (r.status === "nomatch" || r.status === "ambiguous" || !r.dateValid || !(r.amountNum > 0));
    const warn = !bad && (r.flags.dupBatch || r.flags.dupSeen || r.flags.outlier);
    html += `<tr class="${bad?"bad":(warn?"warnrow":"")}">`;

    // status pill
    let pill;
    if(!r.dateValid) pill = `<span class="pill no">bad date</span>`;
    else if(!(r.amountNum > 0)) pill = `<span class="pill no">bad amount</span>`;
    else if(r.status === "ok") pill = `<span class="pill ok">ready</span>`;
    else if(r.status === "ambiguous") pill = `<span class="pill amb">pick one</span>`;
    else if(r.status === "pending") pill = `<span class="pill amb">loading…</span>`;
    else pill = `<span class="pill no">no match</span>`;
    html += `<td>${pill}</td>`;

    // date (editable)
    html += `<td><input class="cell-in mono" style="min-width:92px" value="${escAttr(r.dateStr)}"
      onchange="setDate(${r.id}, this.value)"> ${r.dateValid?`<div class="rawnote">#${r.serial}</div>`:``}</td>`;

    // customer
    html += `<td>`;
    if(r.status === "ok"){
      html += `<div class="resname">${escHtml(r.resolved)}</div>`;
      if(r.autoResolved) html += `<div class="rawnote">from “${escHtml(r.rawName)}”</div>`;
    }else{
      html += `<div class="rawnote">typed: “${escHtml(r.rawName)}”</div>`;
      if(r.candidates.length){
        html += `<select class="cell-in" onchange="pickCand(${r.id}, this.value)">
          <option value="">${r.status==="ambiguous"?"— choose the right one —":"— closest matches —"}</option>`;
        for(const c of r.candidates) html += `<option value="${escAttr(c)}">${escHtml(c)}</option>`;
        html += `</select>`;
      }
      html += `<div style="margin-top:6px"><input class="cell-in" list="allnames" placeholder="search all names…"
        onchange="overrideName(${r.id}, this.value)"></div>`;
    }
    html += `</td>`;

    // amount (editable)
    html += `<td class="num"><input class="cell-in amt mono" value="${escAttr(r.amount)}"
      onchange="setAmount(${r.id}, this.value)"></td>`;

    // mode (editable) + class pill
    const mc = modeClass(r.mode);
    html += `<td><input class="cell-in" style="min-width:150px" value="${escAttr(r.mode)}"
      onchange="setMode(${r.id}, this.value)"><div class="rawnote"><span class="pill mode">${escHtml(mc)}</span></div></td>`;

    // remove
    html += `<td><button class="xbtn" title="Remove" onclick="delRow(${r.id})">✕</button></td>`;

    // flag line spanning under
    const fl = [];
    if(r.flags.dupBatch) fl.push("duplicate within this batch");
    if(r.flags.dupSeen)  fl.push("already exported earlier");
    if(r.flags.outlier)  fl.push("amount looks unusual vs this customer's history");
    if(fl.length) html += `</tr><tr class="warnrow"><td></td><td colspan="5"><div class="flagline">⚠︎ ${escHtml(fl.join(" · "))}</div></td>`;

    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  // Analysis
  html += renderAnalysis();

  host.innerHTML = html;
}

function renderAnalysis(){
  const ex = exportableRows();
  if(!ex.length) return "";
  let total = 0, dates = [];
  const byCust = new Map(), byMode = new Map();
  for(const r of ex){
    total += r.amountNum;
    dates.push(r.serial);
    byCust.set(r.resolved, (byCust.get(r.resolved) || 0) + r.amountNum);
    const mc = modeClass(r.mode);
    byMode.set(mc, (byMode.get(mc) || 0) + r.amountNum);
  }
  dates.sort((a, b) => a - b);
  const range = dates.length ? (dates[0] === dates[dates.length-1] ? serialToDMY(dates[0])
    : serialToDMY(dates[0]) + " – " + serialToDMY(dates[dates.length-1])) : "—";

  let html = `<div class="section-label">Batch summary</div>`;
  html += `<div class="stats">
    <div class="stat hero"><div class="lbl">Total to enter</div><div class="val">₹ ${money(total)}</div></div>
    <div class="stat"><div class="lbl">Ready entries</div><div class="val">${ex.length}</div></div>
    <div class="stat"><div class="lbl">Customers</div><div class="val">${byCust.size}</div></div>
    <div class="stat"><div class="lbl">Date range</div><div class="val" style="font-size:14px">${range}</div></div>
  </div>`;

  // By mode
  const modeOrder = ["UPI","Bank","Cash","Cheque","Mixed","Other","Unspecified"];
  const modeRows = modeOrder.filter(m => byMode.has(m));
  if(modeRows.length){
    html += `<div class="section-label">By payment mode</div><div class="stats">`;
    for(const m of modeRows) html += `<div class="stat"><div class="lbl">${escHtml(m)}</div><div class="val">₹ ${money(byMode.get(m))}</div></div>`;
    html += `</div>`;
  }

  // Running total per customer
  const custRows = [...byCust.entries()].sort((a, b) => b[1] - a[1]);
  if(custRows.length){
    html += `<div class="section-label">Total per customer (this batch)</div>`;
    html += `<div class="tablewrap"><table><thead><tr><th>Customer</th><th class="num">Entries</th><th class="num">Total ₹</th></tr></thead><tbody>`;
    for(const [name, amt] of custRows){
      const cnt = ex.filter(r => r.resolved === name).length;
      html += `<tr><td>${escHtml(name)}</td><td class="num">${cnt}</td><td class="num">${money(amt)}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  return html;
}

function renderExportBar(){
  const bar = document.getElementById("exportbar");
  if(!ROWS.length){ bar.classList.add("hide"); return; }
  bar.classList.remove("hide");
  const ex = exportableRows();
  const total = ex.reduce((s, r) => s + r.amountNum, 0);
  const blocked = ROWS.length - ex.length;
  document.getElementById("exportSum").innerHTML =
    `<b>${ex.length}</b> ready · ₹ ${money(total)}` + (blocked ? ` · <span style="color:var(--warn)">${blocked} need fixing</span>` : "");

}

/* ---------------- Export: .xlsx (dependency-free) ---------------- */
function exportXlsx(){
  const ex = exportableRows();
  if(!ex.length){ alert("No ready entries to export."); return; }
  const blocked = ROWS.length - ex.length;
  if(blocked && !confirm(`${blocked} row(s) still need fixing and will be left out. Export the ${ex.length} ready entr${ex.length===1?"y":"ies"} anyway?`)) return;

  const header = ["Date", "Customer", "Amount Paid", "Payment Mode"];
  const data = ex.map(r => ({serial:r.serial, customer:r.resolved, amount:r.amountNum, mode:r.mode}));
  const blob = buildXlsx(header, data);
  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
  downloadBlob(blob, `vriddhi-payments-${stamp}.xlsx`);

  // Idempotency: record exported keys so a re-run flags duplicates.
  const seen = readSeen();
  for(const r of ex) seen[rowKey(r)] = {ts:Date.now(), customer:r.resolved, amount:r.amountNum, date:r.dateStr};
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); }catch(_){}

  recomputeAndRender();
  alert(`Exported ${ex.length} entr${ex.length===1?"y":"ies"} (₹ ${money(data.reduce((s,d)=>s+d.amount,0))}).\n\nImport the file into Master Paid. These entries are now marked so re-exporting won't duplicate them.`);
}

function exportCsv(){
  const ex = exportableRows();
  if(!ex.length){ alert("No ready entries to export."); return; }
  const esc = s => `"${String(s == null ? "" : s).replace(/"/g, '""')}"`;
  const lines = [["Date (serial)","Date","Customer","Amount Paid","Payment Mode"].map(esc).join(",")];
  for(const r of ex) lines.push([r.serial, serialToDMY(r.serial), r.resolved, r.amountNum, r.mode].map(esc).join(","));
  downloadBlob(new Blob([lines.join("\r\n")], {type:"text/csv"}), "vriddhi-payments.csv");
}

function downloadBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---- Minimal, dependency-free XLSX writer (store-only ZIP) ----
   Column A = Excel date serial (numeric, shown as a date via cell format —
   the stored value is the plain serial, exactly what Master Paid uses).
   Column C = plain number (grouping is a display format, not in the value). */
function buildXlsx(header, rows){
  const N = rows.length + 1;
  const colLetter = c => String.fromCharCode(65 + c);
  const xesc = s => String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

  // sheet cells
  let sheet = "";
  // header row (style s=3 bold)
  sheet += `<row r="1">`;
  for(let c = 0; c < header.length; c++)
    sheet += `<c r="${colLetter(c)}1" t="inlineStr" s="3"><is><t xml:space="preserve">${xesc(header[c])}</t></is></c>`;
  sheet += `</row>`;
  // data rows
  rows.forEach((r, i) => {
    const rr = i + 2;
    sheet += `<row r="${rr}">`;
    sheet += `<c r="A${rr}" s="1"><v>${r.serial}</v></c>`;                                   // date serial
    sheet += `<c r="B${rr}" t="inlineStr"><is><t xml:space="preserve">${xesc(r.customer)}</t></is></c>`;
    sheet += `<c r="C${rr}" s="2"><v>${r.amount}</v></c>`;                                    // plain number
    sheet += `<c r="D${rr}" t="inlineStr"><is><t xml:space="preserve">${xesc(r.mode || "")}</t></is></c>`;
    sheet += `</row>`;
  });

  const sheetXml =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:D${N}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="34" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/><col min="4" max="4" width="30" customWidth="1"/></cols><sheetData>${sheet}</sheetData></worksheet>`;

  const stylesXml =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

  const contentTypes =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;

  const rootRels =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;

  const workbook =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Master Paid" sheetId="1" r:id="rId1"/></sheets></workbook>`;

  const wbRels =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;

  return zipStore([
    {name:"[Content_Types].xml", data:contentTypes},
    {name:"_rels/.rels", data:rootRels},
    {name:"xl/workbook.xml", data:workbook},
    {name:"xl/_rels/workbook.xml.rels", data:wbRels},
    {name:"xl/styles.xml", data:stylesXml},
    {name:"xl/worksheets/sheet1.xml", data:sheetXml},
  ]);
}

/* CRC-32 */
const _crcTable = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ _crcTable[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
/* Build a valid ZIP using the "store" (no compression) method. */
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [];      // Uint8Arrays for local records
  const central = [];
  let offset = 0;
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

  // DOS time/date (fixed to now)
  const dt = new Date();
  const dosTime = ((dt.getHours() & 0x1F) << 11) | ((dt.getMinutes() & 0x3F) << 5) | ((dt.getSeconds() / 2) & 0x1F);
  const dosDate = (((dt.getFullYear() - 1980) & 0x7F) << 9) | (((dt.getMonth() + 1) & 0x0F) << 5) | (dt.getDate() & 0x1F);

  for(const f of files){
    const nameBytes = enc.encode(f.name);
    const dataBytes = enc.encode(f.data);
    const crc = crc32(dataBytes);
    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(dataBytes.length), u32(dataBytes.length), u16(nameBytes.length), u16(0)
    );
    const localHeader = new Uint8Array(local);
    const rec = new Uint8Array(localHeader.length + nameBytes.length + dataBytes.length);
    rec.set(localHeader, 0); rec.set(nameBytes, localHeader.length); rec.set(dataBytes, localHeader.length + nameBytes.length);
    parts.push(rec);

    const cen = [].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(dataBytes.length), u32(dataBytes.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    );
    const cenHeader = new Uint8Array(cen);
    const cenRec = new Uint8Array(cenHeader.length + nameBytes.length);
    cenRec.set(cenHeader, 0); cenRec.set(nameBytes, cenHeader.length);
    central.push(cenRec);

    offset += rec.length;
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(offset), u16(0)
  ));
  return new Blob([...parts, ...central, eocd],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
