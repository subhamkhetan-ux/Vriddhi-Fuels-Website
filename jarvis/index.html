<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Jarvis</title>
<meta name="description" content="Vriddhi Fuels — Jarvis: one assistant for every app, by chat or voice.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0706">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<style>
/* The ledger / payments family: glass over a true-black, orange-lit base. */
:root {
  --bg: #0a0706; --ink: #f5f0eb; --muted: #b4aba2; --faint: #7c746c;
  --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.09);
  --line: rgba(255,255,255,.12); --line-soft: rgba(255,255,255,.07);
  --accent: #ff7a1a; --accent-2: #f4511e; --amber: #ff9e42;
  --good: #2fd08a; --warn: #ffb23e; --bad: #ff6b5e; --info: #8fc1ff;
  --grad: linear-gradient(135deg, #f4511e 0%, #ff8a2b 100%);
  --display: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); overflow-x: clip;
  background:
    radial-gradient(900px 520px at 85% -80px, rgba(244,81,30,.22) 0%, rgba(244,81,30,0) 60%),
    radial-gradient(700px 520px at 0% 10%, rgba(255,158,66,.10) 0%, rgba(255,158,66,0) 55%),
    radial-gradient(900px 600px at 50% 120%, rgba(120,40,180,.12) 0%, rgba(120,40,180,0) 60%),
    var(--bg);
  background-attachment: fixed;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--amber); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app { display: flex; flex-direction: column; height: 100dvh; max-width: 820px; margin: 0 auto; }

/* header */
.top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .4px; }
.brand small { display: block; font: 500 11px/1.2 var(--display); color: var(--muted); letter-spacing: .3px; }
.orb { width: 34px; height: 34px; border-radius: 50%; flex: none; position: relative;
  background: radial-gradient(circle at 35% 30%, #ffd2a6 0%, #ff8a2b 30%, #f4511e 60%, #4a1405 100%);
  box-shadow: 0 0 18px rgba(255,122,26,.55), inset 0 0 8px rgba(255,255,255,.25); }
.orb::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid rgba(255,138,43,.45); }
body.listening .orb { animation: pulse 1.1s ease-in-out infinite; }
body.thinking .orb::after { border-color: transparent; border-top-color: var(--amber); animation: spin .9s linear infinite; }
@keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 34px rgba(255,122,26,.9); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spacer { flex: 1; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); color: var(--muted); white-space: nowrap; }
.pill.ok::before, .pill.off::before, .pill.wait::before { content: "●"; margin-right: 5px; }
.pill.ok::before { color: var(--good); } .pill.off::before { color: var(--bad); } .pill.wait::before { color: var(--warn); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--glass-2); }
.demo-flag { background: var(--warn); color: #241400; font-weight: 700; font-size: 12px; text-align: center; padding: 4px 10px; }

/* chat */
#chat { flex: 1; overflow-y: auto; padding: 8px 16px 16px; scroll-behavior: smooth; }
.hello { text-align: center; padding: 26px 6px 6px; }
.hello h1 { font: 800 26px/1.2 var(--display); margin: 14px 0 4px; }
.hello h1 b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hello p { color: var(--muted); margin: 0 0 18px; }
.hello .orb { width: 74px; height: 74px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 8px 13px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--accent); background: rgba(255,122,26,.12); }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 22px; text-align: left; }
.app-tile { display: block; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line-soft); background: var(--glass); color: var(--ink); text-decoration: none; }
.app-tile:hover { border-color: var(--line); background: var(--glass-2); }
.app-tile b { display: block; font-family: var(--display); font-size: 14px; }
.app-tile span { color: var(--faint); font-size: 12px; line-height: 1.35; display: block; margin-top: 2px; }
.section-title { font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 24px 0 0; text-align: left; }

.msg { display: flex; margin: 12px 0; }
.msg.me { justify-content: flex-end; }
.bubble { max-width: min(560px, 88%); border-radius: var(--r); padding: 10px 14px; border: 1px solid var(--line-soft); background: var(--glass); overflow-wrap: anywhere; }
.msg.me .bubble { background: linear-gradient(135deg, rgba(244,81,30,.85), rgba(255,138,43,.75)); border-color: rgba(255,255,255,.18); color: #fff; border-bottom-right-radius: 6px; }
.msg.jarvis .bubble { border-bottom-left-radius: 6px; max-width: min(640px, 94%); }
.bubble p { margin: 0 0 .5em; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul { margin: .2em 0 .5em; padding-left: 1.2em; }
.bubble .err { color: var(--bad); }
.bubble .muted { color: var(--muted); font-size: 13px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); }

.steps { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.step { font-size: 12.5px; color: var(--muted); display: flex; gap: 7px; align-items: baseline; }
.step::before { content: "◌"; color: var(--warn); }
.step.done::before { content: "✓"; color: var(--good); }
.step.failed::before { content: "✕"; color: var(--bad); }
.step.running::before { display: inline-block; animation: spin 1s linear infinite; }
.step em { font-style: normal; color: var(--faint); }

.pics { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.pic { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.pic img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.pic .bar { display: flex; gap: 4px; padding: 6px; background: rgba(255,255,255,.04); }
.pic .bar span { flex: 1; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }
.btn { border: 1px solid var(--line); background: var(--glass-2); border-radius: 10px; padding: 6px 11px; cursor: pointer; font-size: 13px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.btn:hover { border-color: var(--accent); }
.btn.cta { background: var(--grad); border-color: transparent; color: #fff; font-weight: 700; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.confirm { margin-top: 8px; border: 1px solid rgba(255,178,62,.45); background: rgba(255,178,62,.08); border-radius: 14px; padding: 10px 12px; }
.confirm b { display: block; margin-bottom: 6px; }
.confirm table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.confirm td { padding: 4px 6px 4px 0; border-top: 1px solid var(--line-soft); }
.confirm td:nth-child(2) { font-weight: 700; text-align: right; white-space: nowrap; }
.confirm .note { color: var(--warn); font-size: 12.5px; margin-top: 6px; }
.confirm.done { opacity: .7; }

/* composer */
.composer { padding: 8px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
.pending { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 4px 8px; }
.pending .att { position: relative; }
.pending img { width: 58px; height: 58px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.pending button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: none; background: #333; color: #fff; cursor: pointer; font-size: 12px; }
.box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); background: rgba(20,14,12,.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 22px; padding: 6px; }
.box textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; padding: 9px 4px; max-height: 140px; min-height: 40px; font-size: 16px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; flex: none; background: var(--glass-2); }
.round[hidden] { display: none; }
.round.mic { background: var(--grad); color: #fff; box-shadow: 0 6px 18px -6px rgba(244,81,30,.8); }
body.listening .round.mic { background: var(--bad); animation: pulse 1.1s ease-in-out infinite; }
.round.send { background: var(--ink); color: #120a06; }
.round svg { width: 20px; height: 20px; }
.hint { color: var(--faint); font-size: 12px; text-align: center; margin-top: 6px; min-height: 1em; }

/* sheet */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet .panel { width: min(620px, 100%); max-height: 88dvh; overflow-y: auto; background: #15100e; border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { font: 800 19px var(--display); margin: 0; }
.sheet h3 { font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-size: 13px; color: var(--muted); }
.field input, .field select { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--ink); font-size: 15px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 1px solid var(--line-soft); border-radius: 12px; margin: 6px 0; cursor: pointer; }
.opt input { margin-top: 3px; }
.opt span { font-size: 13px; color: var(--muted); display: block; }
.opt b { font-size: 14px; }
.login { border: 1px solid var(--line-soft); border-radius: 14px; padding: 10px 12px; margin: 8px 0; }
.login .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ok-text { color: var(--good); } .warn-text { color: var(--warn); } .bad-text { color: var(--bad); }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60; display: grid; place-items: center; padding: 16px; }
.viewer img { max-width: 100%; max-height: 90dvh; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: #222; border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px; z-index: 70; font-size: 14px; }
@media (max-width: 520px) { .pills { display: none; } .top { padding-left: 12px; padding-right: 12px; } #chat { padding-left: 12px; padding-right: 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="hello"><div class="orb"></div><h1>Starting <b>Jarvis</b>…</h1></div></div>
<!-- the other apps' public settings: Jarvis talks to each app's own database -->
<script src="../ledger/config.js"></script>
<script src="../decant/config.js"></script>
<script src="../fleet/config.js"></script>
<script src="../payments/config.js"></script>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
