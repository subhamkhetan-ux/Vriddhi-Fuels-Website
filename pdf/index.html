<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111E3E">
<meta name="description" content="Free PDF tools that run in your browser: merge, split, compress, convert, OCR, edit, sign, redact, protect and more. Files never leave your device.">
<title>PDF Toolkit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../Vriddhi%20Fuels%20Logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <img src="icon.svg" alt="" width="30" height="30">
    <span>PDF Toolkit</span>
  </a>
  <label class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
    <input id="search" type="search" placeholder="Search tools" autocomplete="off">
  </label>
  <span class="badge-private" title="Files are processed on this device and never uploaded">🔒 Private · on-device</span>
</header>
<main id="view" tabindex="-1"></main>
<div id="busy" class="busy" hidden>
  <div class="busy-card">
    <div class="spinner"></div>
    <div id="busy-label">Working…</div>
    <div class="bar"><div id="busy-bar"></div></div>
    <button id="busy-cancel" class="btn ghost small" type="button">Cancel</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
