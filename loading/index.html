<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#111E3E" />
<title>Vriddhi Fuels — Tanker Loading</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="../Vriddhi%20Fuels%20Logo.png" />
<script src="./config.js"></script>
<style>
  :root{
    --navy:#111E3E; --navy2:#1c2f5e; --amber:#f5a623; --amber-d:#d98a05;
    --green:#1f9d55; --green-d:#178048; --red:#d64545; --red-d:#b83636;
    --bg:#eef1f6; --card:#ffffff; --ink:#16233f; --muted:#5b6b83;
    --line:#d9dee8; --shadow:0 6px 18px rgba(17,30,62,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* Header */
  header{
    background:var(--navy); color:#fff; padding:14px 16px;
    display:flex;align-items:center;gap:12px; position:sticky; top:0; z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header img{width:40px;height:40px;border-radius:9px;background:#fff;object-fit:contain;padding:3px}
  header .t{font-size:19px;font-weight:800;letter-spacing:.2px;line-height:1.1}
  header .s{font-size:12px;opacity:.75;margin-top:2px}
  .back{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:22px;font-weight:800;
    width:44px;height:44px;border-radius:12px;line-height:1;cursor:pointer;flex:none}
  main{flex:1;padding:16px 16px 28px}
  .screen{display:none;animation:fade .18s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Big primary button */
  .big{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:0;border-radius:18px;padding:22px 18px;font-size:22px;font-weight:800;
    color:#fff;background:var(--amber);box-shadow:var(--shadow);cursor:pointer;margin-bottom:14px;
    -webkit-appearance:none;
  }
  .big:active{transform:translateY(1px)}
  .big:disabled{opacity:.6}
  .big.green{background:var(--green)} .big.navy{background:var(--navy)} .big.red{background:var(--red)}
  .big .hi{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:2px}
  .big .em{font-size:26px}

  /* Stat card */
  .stat{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center}
  .stat .label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .stat .num{font-size:44px;font-weight:900;color:var(--navy);line-height:1.05;margin:4px 0}
  .stat .num small{font-size:20px;font-weight:800;color:var(--amber-d)}
  .stat .sub{font-size:13px;color:var(--muted)}

  .row2{display:flex;gap:10px}
  .row2>*{flex:1}
  .mini{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
  .mini .n{font-size:24px;font-weight:900;color:var(--navy)}
  .mini .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

  .sectitle{font-size:14px;font-weight:800;color:var(--navy);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
  .sectitle .lnk{font-size:13px;color:var(--amber-d);font-weight:700;cursor:pointer;background:none;border:0}

  /* Entry list */
  .entry{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .entry .plate{font-weight:900;font-size:15px;color:#fff;background:var(--navy);border-radius:8px;padding:6px 8px;letter-spacing:.5px;white-space:nowrap}
  .entry .mid{flex:1;min-width:0}
  .entry .ch{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .tm{font-size:12px;color:var(--muted);margin-top:2px}
  .entry .tot{font-weight:900;font-size:17px;color:var(--green-d);white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px}

  /* Vehicle cards */
  .vcard{
    width:100%;border:0;border-radius:18px;padding:20px;margin-bottom:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);
    color:#fff;text-align:left;-webkit-appearance:none;
  }
  .vcard:active{transform:translateY(1px)}
  .vcard .pl{font-size:26px;font-weight:900;letter-spacing:1px}
  .vcard .info{font-size:13px;opacity:.9;margin-top:4px;font-weight:600}
  .vcard .cc{font-size:34px;font-weight:900;opacity:.9}

  /* Chamber rows */
  .vhead{background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
  .vhead .pl{font-size:26px;font-weight:900;letter-spacing:1px}
  .vhead .cap{font-size:12px;opacity:.8;margin-top:3px}
  .cham{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:2px solid transparent}
  .cham.filled{border-color:var(--green)}
  .cham .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cham .badge{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
  .cham .cn{font-weight:800;font-size:17px}
  .cham .cd{font-size:12px;color:var(--muted)}
  .cham .cap-tag{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
  .cham .warn{color:var(--red);font-weight:700;font-size:12px;margin-top:2px;display:none}
  .cham.over .warn{display:block}
  /* progress bar */
  .bar{height:14px;border-radius:8px;background:#e6eaf1;overflow:hidden;margin:2px 0 8px}
  .bar.lg{height:20px;border-radius:10px;background:rgba(255,255,255,.22);margin:8px 0 6px}
  .bar .fill{height:100%;width:0%;background:var(--green);border-radius:8px;transition:width .18s ease}
  .bar.lg .fill{background:#37d67a}
  .cham.over .bar .fill{background:var(--red)}
  .lr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}
  .lr .loaded b{color:var(--green-d);font-weight:900;font-size:18px}
  .lr .left b{color:var(--navy);font-weight:900;font-size:18px}
  .lr .over-txt{color:var(--red);font-weight:800;display:none}
  .cham.over .lr .left{display:none}
  .cham.over .lr .over-txt{display:inline}
  .qtyrow{display:flex;gap:8px;align-items:stretch}
  .qtyrow input{
    flex:1;min-width:0;font-size:30px;font-weight:900;text-align:center;color:var(--navy);
    border:2px solid var(--line);border-radius:12px;padding:8px 6px;background:#fff;width:100%;
    -moz-appearance:textfield;
  }
  .qtyrow input::-webkit-outer-spin-button,.qtyrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qtyrow input:focus{outline:none;border-color:var(--amber)}
  .qbtn{border:0;border-radius:12px;padding:0 14px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:var(--navy2);flex:none}
  .qbtn.clr{background:#8894ad}
  .qbtn:active{transform:translateY(1px)}

  .runtot{position:sticky;bottom:0;background:linear-gradient(#eef1f6cc,#eef1f6);padding-top:8px}
  .sumbar{background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
  .sumrow{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700}
  .sumrow .s-load b{font-size:24px;font-weight:900;color:#37d67a}
  .sumrow .s-left b{font-size:24px;font-weight:900;color:#ffd27a}
  .sumcap{text-align:center;font-size:12px;opacity:.75;font-weight:600}

  /* Confirm */
  .confbox{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .confbox .cp{text-align:center;font-size:26px;font-weight:900;color:var(--navy);letter-spacing:1px;margin-bottom:4px}
  .confbox .ct{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px}
  .cline{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--line);font-size:17px}
  .cline .cq{font-weight:900}
  .cline.grand{border-top:2px solid var(--navy);margin-top:4px;font-size:20px;font-weight:900;color:var(--green-d)}

  /* History */
  .daygrp{margin-bottom:16px}
  .dayhd{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-weight:800;color:var(--navy);font-size:15px}
  .dayhd .dt{font-weight:900;color:var(--green-d)}
  .del{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;padding:4px 6px;flex:none}

  .note{font-size:12px;color:var(--muted);text-align:center;margin:12px 4px;line-height:1.5}
  .signrow{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
  .signrow b{color:var(--navy)}
  .signrow button{background:none;border:0;color:var(--red-d);font-weight:700;cursor:pointer;text-decoration:underline;font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--green-d);color:#fff;
    padding:14px 22px;border-radius:14px;font-weight:800;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;
    transition:.25s;z-index:100;pointer-events:none;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .installbtn{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px;cursor:pointer}
  .livedot{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#bfe6cf;background:rgba(31,157,85,.18);border:1px solid rgba(31,157,85,.5);border-radius:20px;padding:3px 9px}
  .livedot i{width:8px;height:8px;border-radius:50%;background:#37d67a;display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* Login */
  .loginwrap{position:fixed;inset:0;background:var(--navy);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
  .loginwrap.on{display:flex}
  .loginbox{width:100%;max-width:380px;text-align:center;color:#fff}
  .loginbox img{width:76px;height:76px;border-radius:18px;background:#fff;padding:8px;object-fit:contain;margin-bottom:14px}
  .loginbox h1{font-size:24px;font-weight:900;margin:0 0 2px}
  .loginbox .lsub{font-size:14px;opacity:.75;margin-bottom:22px}
  .loginbox input{width:100%;font-size:19px;padding:16px;border-radius:14px;border:0;margin-bottom:12px;text-align:center;background:#fff;color:var(--ink);font-weight:600}
  .loginbox input:focus{outline:3px solid var(--amber)}
  .lerr{color:#ffb4b4;font-weight:700;font-size:14px;min-height:20px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn" style="display:none" aria-label="Back">‹</button>
    <img src="../Vriddhi%20Fuels%20Logo.png" alt="Vriddhi Fuels" onerror="this.style.display='none'"/>
    <div style="flex:1">
      <div class="t">Tanker Loading</div>
      <div class="s" id="subT">Diesel loading record</div>
    </div>
    <button class="installbtn" id="installBtn" style="display:none">Install</button>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen on" id="scHome">
      <button class="big" id="newBtn">
        <span class="em">⛽</span>
        <span>New Loading</span>
      </button>

      <div class="stat">
        <div class="label">Today loaded</div>
        <div class="num"><span id="todayTot">0</span> <small>L</small></div>
        <div class="sub"><span id="todayCnt">0</span> loadings today</div>
      </div>

      <div class="row2">
        <div class="mini"><div class="n" id="allTot">0</div><div class="l" id="allTotL">Total L</div></div>
        <div class="mini"><div class="n" id="allCnt">0</div><div class="l" id="allCntL">Loadings</div></div>
      </div>

      <div class="sectitle">Recent
        <button class="lnk" id="toHist">View all ›</button>
      </div>
      <div id="recentList"></div>

      <div class="note" id="storeNote"></div>
      <div class="signrow" id="signRow" style="display:none"></div>
    </section>

    <!-- PICK VEHICLE -->
    <section class="screen" id="scPick">
      <div class="sectitle" style="font-size:18px;justify-content:center">Step 1 — Choose the tanker</div>
      <div id="vList"></div>
    </section>

    <!-- ENTER QTY -->
    <section class="screen" id="scQty">
      <div class="vhead">
        <div class="pl" id="qPlate">—</div>
        <div class="cap">Step 2 — Type how many litres you loaded into each chamber</div>
      </div>
      <div id="chamList"></div>
      <div class="runtot">
        <div class="sumbar">
          <div class="sumrow">
            <span class="s-load">Loaded <b id="sumLoaded">0</b> L</span>
            <span class="s-left">Left <b id="sumLeft">0</b> L</span>
          </div>
          <div class="bar lg"><div class="fill" id="sumFill" style="width:0%"></div></div>
          <div class="sumcap">of <span id="sumCap">0</span> L full tanker</div>
        </div>
        <button class="big green" id="reviewBtn" style="margin-bottom:6px">
          <span class="em">✓</span><span>Save</span>
        </button>
      </div>
    </section>

    <!-- CONFIRM -->
    <section class="screen" id="scConf">
      <div class="sectitle" style="justify-content:center">Step 3 — Check &amp; save</div>
      <div class="confbox" id="confBox"></div>
      <button class="big green" id="saveBtn"><span class="em">✓</span><span>Confirm &amp; Save</span></button>
      <button class="big navy" id="editBtn" style="background:#8894ad"><span>‹ Edit</span></button>
    </section>

    <!-- HISTORY -->
    <section class="screen" id="scHist">
      <div class="row2" style="margin-bottom:12px">
        <div class="mini"><div class="n" id="hTot">0</div><div class="l">Total litres</div></div>
        <div class="mini"><div class="n" id="hCnt">0</div><div class="l">Loadings</div></div>
      </div>
      <button class="big navy" id="exportBtn" style="font-size:17px;padding:16px">
        <span class="em">📤</span><span>Export to Excel / CSV</span>
      </button>
      <div id="histList"></div>
    </section>
  </main>
</div>

<!-- LOGIN (cloud mode only) -->
<div class="loginwrap" id="login">
  <div class="loginbox">
    <img src="../Vriddhi%20Fuels%20Logo.png" alt="Vriddhi Fuels" onerror="this.style.display='none'"/>
    <h1>Tanker Loading</h1>
    <div class="lsub">Sign in</div>
    <input id="loginUser" placeholder="Username" autocapitalize="off" autocorrect="off" autocomplete="username" spellcheck="false" />
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
    <div class="lerr" id="loginErr"></div>
    <button class="big green" id="btnLogin" style="margin-bottom:0"><span>Sign in</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- Vehicle configuration ---------- */
const VEHICLES = [
  { plate:"OD23A3710", caps:[3985,3985,3985],       color:"#1f6f8b" },
  { plate:"OR15R1110", caps:[3985,3985,3985],       color:"#2d7d46" },
  { plate:"OR15R5510", caps:[3985,3985,3985],       color:"#8a5a1e" },
  { plate:"OR15R9360", caps:[4485,4485,4485,4485],  color:"#6a3d8c" },
];

/* ---------- Mode & config ----------
   With Supabase configured in config.js the app runs in CLOUD mode: every
   employee signs in, all phones share ONE live list (instant realtime sync),
   and data is kept for the last 7 days only. Without config it runs in LOCAL
   mode: single-device, everything in this browser's storage, kept forever. */
const CFG = window.VRIDDHI_LOADING_CONFIG || {};
const CLOUD = /^https:\/\//.test(CFG.SUPABASE_URL || "")
  && String(CFG.SUPABASE_URL).indexOf("PASTE") === -1
  && !!CFG.SUPABASE_ANON_KEY
  && String(CFG.SUPABASE_ANON_KEY).indexOf("PASTE") === -1;
const RETAIN_DAYS = 7;

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const fmt = n=> (Math.round(n)).toLocaleString("en-IN");
function pad(n){ return n<10?"0"+n:""+n; }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayLabel(ts){
  const d=new Date(ts), t=new Date(), y=new Date(Date.now()-864e5);
  if(dayKey(ts)===dayKey(t.getTime())) return "Today";
  if(dayKey(ts)===dayKey(y.getTime())) return "Yesterday";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
}
function timeLabel(ts){ const d=new Date(ts); let h=d.getHours(); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+pad(d.getMinutes())+" "+ap; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400); }
function oops(e){ toast((e && e.message) || "Something went wrong — try again"); }
function vehicleOf(plate){ return VEHICLES.find(v=>v.plate===plate); }
function localId(){ return Date.now()+"-"+Math.random().toString(36).slice(2,7); }

/* ---------- Data (in-memory cache of loading events) ---------- */
let LOG = [];        // [{id, ts, plate, chambers:[{name,qty,cap}], total, by}]
let ME = "";         // signed-in username (cloud mode)

/* ---------- Backends ---------- */
const LS_KEY = "vf_loading_log_v1";
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; } }
function lsSave(list){ localStorage.setItem(LS_KEY, JSON.stringify(list)); }

const LocalBackend = {
  cloud:false,
  load(){ return Promise.resolve(lsLoad().sort((a,b)=>a.ts-b.ts)); },
  add(entry){ const l=lsLoad(); l.push(entry); lsSave(l); return Promise.resolve(); },
  remove(id){ lsSave(lsLoad().filter(x=>x.id!==id)); return Promise.resolve(); },
};

const CloudBackend = {
  cloud:true, client:null,
  rpc(name,args){ return this.client.rpc(name,args).then(r=>{ if(r.error) throw new Error(r.error.message||"Network error"); return r.data; }); },
  load(){
    // RLS already restricts to the last 7 days; ask oldest-first for display.
    return this.client.from("loading_events").select("*").order("created_at",{ascending:true}).then(r=>{
      if(r.error) throw new Error(r.error.message);
      return (r.data||[]).map(row=>({
        id: row.id,
        ts: row.created_at ? Date.parse(row.created_at) : Date.now(),
        plate: row.vehicle,
        chambers: Array.isArray(row.chambers) ? row.chambers : (row.chambers||[]),
        total: parseFloat(row.total),
        by: row.by_name || "",
      }));
    });
  },
  add(entry){ return this.rpc("loading_add",{ p_vehicle:entry.plate, p_chambers:entry.chambers, p_total:entry.total, p_by:entry.by||ME }); },
  remove(id){ return this.rpc("loading_delete",{ p_id:id }); },
  purge(){ return this.rpc("loading_purge",{}).catch(()=>{}); },
};

let Backend = LocalBackend;
function refresh(){ return Backend.load().then(list=>{ LOG=list; }); }

/* ---------- Screen routing ---------- */
const SCREENS=["scHome","scPick","scQty","scConf","scHist"];
let stack=["scHome"];
function show(id, pushIt){
  SCREENS.forEach(s=>$("#"+s).classList.toggle("on", s===id));
  if(pushIt!==false){ if(stack[stack.length-1]!==id) stack.push(id); }
  $("#backBtn").style.display = stack.length>1 ? "" : "none";
  window.scrollTo(0,0);
}
function goBack(){
  if(stack.length>1){ stack.pop(); const id=stack[stack.length-1]; show(id,false); }
  if(stack[stack.length-1]==="scHome") renderHome();
  if(stack[stack.length-1]==="scHist") renderHist();
}
$("#backBtn").onclick=goBack;
function goHome(){ stack=["scHome"]; show("scHome",false); renderHome(); }

/* ---------- Draft (current loading) ---------- */
let draft = null; // { plate, qty:[..] }

/* ---------- HOME ---------- */
function totals(list){ return list.reduce((s,e)=>s+e.total,0); }
function renderHome(){
  const tKey=dayKey(Date.now());
  const today=LOG.filter(e=>dayKey(e.ts)===tKey);
  $("#todayTot").textContent=fmt(totals(today));
  $("#todayCnt").textContent=today.length;
  $("#allTot").textContent=fmt(totals(LOG));
  $("#allCnt").textContent=LOG.length;
  $("#allTotL").textContent = CLOUD ? "Litres · 7 days" : "Total L";
  $("#allCntL").textContent = CLOUD ? "Loadings · 7 days" : "Loadings";
  const recent=[...LOG].slice(-5).reverse();
  const box=$("#recentList");
  if(!recent.length){ box.innerHTML='<div class="empty">No loadings yet.<br>Tap “New Loading” to start.</div>'; }
  else box.innerHTML=recent.map(entryHTML).join("");
  $("#storeNote").innerHTML = CLOUD
    ? "Shared live list — all employees see the same data. Kept for the last 7 days."
    : (LOG.length
      ? "Records are saved on this phone. Tap “Export” in history now and then to keep a backup."
      : "");
  const sr=$("#signRow");
  if(CLOUD && ME){ sr.style.display=""; sr.innerHTML='Signed in as <b>'+ME+'</b> · <button id="btnSignOut">Sign out</button>';
    $("#btnSignOut").onclick=signOut; }
  else sr.style.display="none";
}
function entryHTML(e){
  const chs=e.chambers.map(c=>c.name+" "+fmt(c.qty)).join(" · ");
  const who = (CLOUD && e.by) ? ' · '+e.by : '';
  return '<div class="entry">'
    +'<span class="plate">'+e.plate+'</span>'
    +'<div class="mid"><div class="ch">'+chs+'</div><div class="tm">'+dayLabel(e.ts)+' · '+timeLabel(e.ts)+who+'</div></div>'
    +'<span class="tot">'+fmt(e.total)+' L</span></div>';
}

/* ---------- PICK VEHICLE ---------- */
function renderPick(){
  $("#vList").innerHTML = VEHICLES.map((v,i)=>
    '<button class="vcard" style="background:'+v.color+'" data-i="'+i+'">'
    +'<div><div class="pl">'+v.plate+'</div><div class="info">'+v.caps.length+' chambers · '+fmt(v.caps[0])+' L each</div></div>'
    +'<div class="cc">'+v.caps.length+'</div></button>'
  ).join("");
  $("#vList").querySelectorAll(".vcard").forEach(b=>{
    b.onclick=()=>{ const v=VEHICLES[+b.dataset.i]; startDraft(v); };
  });
}

/* ---------- ENTER QTY ---------- */
function startDraft(v){
  draft={ plate:v.plate, qty:v.caps.map(()=>"") };
  $("#qPlate").textContent=v.plate;
  renderChambers();
  show("scQty");
}
function renderChambers(){
  const v=vehicleOf(draft.plate);
  $("#chamList").innerHTML = v.caps.map((cap,i)=>{
    const val=draft.qty[i];
    const over = val!=="" && (+val)>cap;
    return '<div class="cham'+(val!==""&&+val>0?" filled":"")+(over?" over":"")+'" data-i="'+i+'">'
      +'<div class="top"><div class="badge">C'+(i+1)+'</div>'
      +'<div class="cn">Chamber '+(i+1)+'</div>'
      +'<div class="cap-tag">Full '+fmt(cap)+' L</div></div>'
      +'<div class="bar"><div class="fill" data-fill></div></div>'
      +'<div class="lr">'
      +'<span class="loaded">Loaded <b data-loaded>0</b> L</span>'
      +'<span class="left">Left <b data-left>'+fmt(cap)+'</b> L</span>'
      +'<span class="over-txt">⚠ Over full by <b data-over>0</b> L</span>'
      +'</div>'
      +'<div class="qtyrow">'
      +'<button class="qbtn clr" data-clr="'+i+'">Clear</button>'
      +'<input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+val+'" data-in="'+i+'" />'
      +'<button class="qbtn" data-full="'+i+'">Full</button>'
      +'</div></div>';
  }).join("");
  const cl=$("#chamList");
  cl.querySelectorAll("input[data-in]").forEach(inp=>{
    inp.oninput=()=>{ let val=inp.value.replace(/[^0-9]/g,""); inp.value=val; draft.qty[+inp.dataset.in]=val; refreshChamState(); };
  });
  cl.querySelectorAll("[data-full]").forEach(b=>{ b.onclick=()=>{ const i=+b.dataset.full; draft.qty[i]=""+v.caps[i]; renderChambers(); }; });
  cl.querySelectorAll("[data-clr]").forEach(b=>{ b.onclick=()=>{ const i=+b.dataset.clr; draft.qty[i]=""; renderChambers(); }; });
  refreshChamState();
}
function refreshChamState(){
  const v=vehicleOf(draft.plate);
  $("#chamList").querySelectorAll(".cham").forEach(el=>{
    const i=+el.dataset.i, cap=v.caps[i], raw=draft.qty[i], entered=raw===""?0:+raw;
    const over = raw!=="" && entered>cap;
    el.classList.toggle("filled", entered>0);
    el.classList.toggle("over", over);
    const pct = cap>0 ? Math.min(entered/cap,1)*100 : 0;
    el.querySelector("[data-fill]").style.width = pct+"%";
    el.querySelector("[data-loaded]").textContent = fmt(entered);
    el.querySelector("[data-left]").textContent = fmt(Math.max(cap-entered,0));
    el.querySelector("[data-over]").textContent = fmt(Math.max(entered-cap,0));
  });
  updateRun();
}
function draftTotal(){ return draft.qty.reduce((s,q)=> s+(q===""?0:+q),0); }
function capTotal(){ return vehicleOf(draft.plate).caps.reduce((s,c)=>s+c,0); }
function updateRun(){
  const loaded=draftTotal(), cap=capTotal(), left=Math.max(cap-loaded,0);
  $("#sumLoaded").textContent=fmt(loaded);
  $("#sumLeft").textContent=fmt(left);
  $("#sumCap").textContent=fmt(cap);
  $("#sumFill").style.width=(cap>0?Math.min(loaded/cap,1)*100:0)+"%";
}

$("#reviewBtn").onclick=()=>{
  const tot=draftTotal();
  if(tot<=0){ toast("Enter at least one quantity"); return; }
  renderConfirm();
  show("scConf");
};

/* ---------- CONFIRM ---------- */
function renderConfirm(){
  const v=vehicleOf(draft.plate);
  let rows="";
  v.caps.forEach((cap,i)=>{
    const q=draft.qty[i];
    if(q!==""&&+q>0) rows+='<div class="cline"><span>Chamber '+(i+1)+'</span><span class="cq">'+fmt(+q)+' L</span></div>';
  });
  $("#confBox").innerHTML='<div class="cp">'+draft.plate+'</div>'
    +'<div class="ct">'+new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+' · '+timeLabel(Date.now())+(CLOUD&&ME?' · '+ME:'')+'</div>'
    +rows
    +'<div class="cline grand"><span>TOTAL</span><span>'+fmt(draftTotal())+' L</span></div>';
}
$("#editBtn").onclick=()=>{ show("scQty",false); stack.pop(); $("#backBtn").style.display=stack.length>1?"":"none"; };
$("#saveBtn").onclick=()=>{
  const v=vehicleOf(draft.plate);
  const chambers=[];
  v.caps.forEach((cap,i)=>{ const q=draft.qty[i]; if(q!==""&&+q>0) chambers.push({name:"C"+(i+1),qty:+q,cap:cap}); });
  if(!chambers.length){ toast("Nothing to save"); return; }
  const entry={ id:localId(), ts:Date.now(), plate:draft.plate, chambers:chambers, total:draftTotal(), by:ME };
  const btn=$("#saveBtn"); btn.disabled=true;
  Backend.add(entry).then(refresh).then(()=>{
    btn.disabled=false; draft=null; goHome(); toast("✓ Saved — "+fmt(entry.total)+" L");
  }).catch(e=>{ btn.disabled=false; oops(e); });
};

/* ---------- HISTORY ---------- */
function renderHist(){
  $("#hTot").textContent=fmt(totals(LOG));
  $("#hCnt").textContent=LOG.length;
  const box=$("#histList");
  if(!LOG.length){ box.innerHTML='<div class="empty">No records yet.</div>'; return; }
  const groups={};
  [...LOG].reverse().forEach(e=>{ const k=dayKey(e.ts); (groups[k]=groups[k]||[]).push(e); });
  box.innerHTML=Object.keys(groups).map(k=>{
    const arr=groups[k], dtot=totals(arr);
    return '<div class="daygrp"><div class="dayhd"><span>'+dayLabel(arr[0].ts)+'</span><span class="dt">'+fmt(dtot)+' L</span></div>'
      + arr.map(e=>{
        const chs=e.chambers.map(c=>c.name+" "+fmt(c.qty)).join(" · ");
        const who=(CLOUD&&e.by)?' · '+e.by:'';
        return '<div class="entry"><span class="plate">'+e.plate+'</span>'
          +'<div class="mid"><div class="ch">'+chs+'</div><div class="tm">'+timeLabel(e.ts)+who+'</div></div>'
          +'<span class="tot">'+fmt(e.total)+' L</span>'
          +'<button class="del" data-del="'+e.id+'" aria-label="Delete">🗑</button></div>';
      }).join("")
      +'</div>';
  }).join("");
  box.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=()=>{
      const e=LOG.find(x=>x.id===b.dataset.del); if(!e) return;
      if(confirm("Delete this record?\n"+e.plate+" — "+fmt(e.total)+" L")){
        Backend.remove(b.dataset.del).then(refresh).then(()=>{ renderHist(); toast("Deleted"); }).catch(oops);
      }
    };
  });
}

/* ---------- EXPORT CSV ---------- */
$("#exportBtn").onclick=()=>{
  if(!LOG.length){ toast("Nothing to export"); return; }
  const maxC=Math.max(...VEHICLES.map(v=>v.caps.length));
  const head=["Date","Time","Vehicle"];
  for(let i=1;i<=maxC;i++) head.push("C"+i+" (L)");
  head.push("Total (L)");
  if(CLOUD) head.push("By");
  const rows=[head];
  [...LOG].sort((a,b)=>a.ts-b.ts).forEach(e=>{
    const d=new Date(e.ts);
    const r=[ d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()), timeLabel(e.ts), e.plate ];
    for(let i=1;i<=maxC;i++){ const c=e.chambers.find(x=>x.name==="C"+i); r.push(c?c.qty:""); }
    r.push(e.total);
    if(CLOUD) r.push(e.by||"");
    rows.push(r);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="Tanker_Loading_"+dayKey(Date.now())+".csv"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
  toast("Exported "+LOG.length+" records");
};

/* ---------- Nav buttons ---------- */
$("#newBtn").onclick=()=>{ renderPick(); show("scPick"); };
$("#toHist").onclick=()=>{ renderHist(); show("scHist"); };

/* ---------- Realtime (cloud) ---------- */
let realtimeOn=false;
function subscribeRealtime(){
  if(realtimeOn || !CloudBackend.client.channel) return;
  realtimeOn=true;
  let t;
  const poke=()=>{ clearTimeout(t); t=setTimeout(()=>{ refresh().then(()=>{
    const cur=stack[stack.length-1];
    if(cur==="scHome") renderHome(); else if(cur==="scHist") renderHist();
  }).catch(()=>{}); }, 350); };
  CloudBackend.client.channel("loading-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"loading_events"},poke)
    .subscribe();
}

/* ---------- Login / session (cloud) ---------- */
function showLogin(){ $("#login").classList.add("on"); }
function hideLogin(){ $("#login").classList.remove("on"); }
function loginError(m){ $("#loginErr").textContent=m||""; }
function usernameFromEmail(email){ return (email||"").split("@")[0]; }

function startApp(session){
  hideLogin();
  Backend=CloudBackend;
  ME = usernameFromEmail(session && session.user && session.user.email);
  subscribeRealtime();
  CloudBackend.purge();
  return refresh().then(()=>{ goHome(); }).catch(oops);
}
function signOut(){
  if(!confirm("Sign out of this phone?")) return;
  CloudBackend.client.auth.signOut().then(()=>{ LOG=[]; ME=""; goHome(); showLogin(); });
}

$("#btnLogin").onclick=function(){
  const u=$("#loginUser").value.trim().toLowerCase();
  const p=$("#loginPass").value;
  if(!u||!p){ loginError("Enter username and password"); return; }
  const email = u.indexOf("@")!==-1 ? u : u+"@vriddhi.local";
  const btn=$("#btnLogin"); btn.disabled=true;
  loginError("");
  CloudBackend.client.auth.signInWithPassword({ email:email, password:p }).then(res=>{
    btn.disabled=false;
    if(res.error){ loginError("Wrong username or password"); return; }
    $("#loginPass").value="";
    return startApp(res.data.session);
  });
};
$("#loginPass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#btnLogin").click(); });

/* ---------- PWA install ---------- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; $("#installBtn").style.display=""; });
$("#installBtn").onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("#installBtn").style.display="none"; };

/* ---------- Boot ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{})); }

function boot(){
  if(!CLOUD){
    Backend=LocalBackend;
    refresh().then(()=>{ renderHome(); }).catch(oops);
    return;
  }
  const factory = window.__VF_TEST_SUPABASE_FACTORY
    ? Promise.resolve(window.__VF_TEST_SUPABASE_FACTORY)
    : import("https://esm.sh/@supabase/supabase-js@2").then(m=>m.createClient);
  factory.then(createClient=>{
    CloudBackend.client = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    CloudBackend.client.auth.onAuthStateChange((event)=>{ if(event==="SIGNED_OUT"){ LOG=[]; ME=""; showLogin(); } });
    return CloudBackend.client.auth.getSession().then(res=>{
      const sess = res.data && res.data.session;
      if(sess) return startApp(sess);
      showLogin();
    });
  }).catch(e=>{ showLogin(); loginError("Could not connect: "+((e&&e.message)||e)); });
}
boot();

})();
</script>
