<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vriddhi Ledger</title>
<meta name="description" content="Vriddhi Fuels — Master Ledger in the cloud: sales import, PO lists, customers.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0706">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root {
  --bg: #0a0706; --panel: #141518; --panel2: #1e2026; --line: #2c2e36; --line-soft: #23252c;
  --ink: #f5f0eb; --muted: #b4aba2; --faint: #7c746c;
  --accent: #ff7a1a; --accent-2: #f4511e; --accent-soft: #ff7a1a24;
  --good: #2fd08a; --good-bg: #2fd08a1f; --warn: #ffb23e; --warn-bg: #ffb23e1f;
  --bad: #ff6b5e; --bad-bg: #ff6b5e1f; --info: #8fc1ff; --info-bg: #8fc1ff1f;
  --grad: linear-gradient(135deg, #f4511e 0%, #ff8a2b 100%);
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0 0 .5em; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 500; } h1 b { color: var(--accent); }
h2 { font-size: 20px; } h3 { font-size: 16px; }
p { margin: .5em 0; }
code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
code { background: var(--panel2); padding: 1px 5px; border-radius: 5px; }
pre.code { background: var(--panel2); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }
.good-text { color: var(--good); } .warn-text { color: var(--warn); } .bad-text { color: var(--bad); }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* shell */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.brand { color: var(--ink); font-size: 18px; } .brand b { color: var(--accent); }
.brand:hover { text-decoration: none; }
.spacer { flex: 1; }
.who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; white-space: nowrap; }
.tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--bg); z-index: 5; overflow-x: auto; }
.tabs a { color: var(--muted); padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
.tabs a.on { color: var(--ink); background: var(--panel2); }
.tabs a:hover { text-decoration: none; color: var(--ink); }
main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 96px; }
@media (max-width: 640px) {
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; top: auto; border-top: 1px solid var(--line); border-bottom: 0; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabs a { padding: 8px 6px; font-size: 13px; }
  .who { display: none; }
}

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 0 0 14px; }
.good-card { border-color: #2fd08a55; background: linear-gradient(0deg, var(--good-bg), var(--good-bg)), var(--panel); }
.bad-card { border-color: #ff6b5e66; background: linear-gradient(0deg, var(--bad-bg), var(--bad-bg)), var(--panel); }
.center { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.center-card { width: min(520px, 100%); }
.hero .eyebrow { color: var(--muted); margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.hero h2 { font-size: 28px; margin: 2px 0 10px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 8px 0; }
.stats .num { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats .lbl { color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.steps { padding-left: 20px; } .steps li { margin: 6px 0; }

/* buttons + inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--grad); color: #1a0d05; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { text-decoration: none; filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost:hover { border-color: var(--accent); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.icon { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; }
.icon:hover:not(:disabled) { border-color: var(--accent); }
.icon:disabled { opacity: .3; cursor: default; }
input, select { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; max-width: 100%; }
input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=search] { width: 100%; margin-top: 10px; }
label { display: block; color: var(--muted); font-size: 13px; }
label input, label select { display: block; margin-top: 4px; width: 100%; }
.stack { display: grid; gap: 10px; }
.row-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin: 8px 0; }
.row-form label { flex: 1 1 160px; }
.row-form.inline { margin: 0; flex-wrap: nowrap; }
.row-form.inline input { width: 150px; }
label.radio { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; flex-wrap: wrap; }
label.radio input[type=radio] { width: auto; margin: 0; }
label.radio input[name=po] { display: inline-block; width: auto; flex: 1 1 140px; margin: 0; }
.inline-label { display: flex; align-items: center; gap: 8px; }
.inline-label select { margin: 0; width: auto; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.file { display: inline-block; margin: 6px 0; }
.file input:focus-visible + .btn { outline: 2px solid var(--accent); }
.form-msg { min-height: 1.2em; margin: 0; }

/* chips, pills, lists */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip.on { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
.pill { display: inline-block; font-size: 11.5px; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; vertical-align: middle; }
.good-pill { color: var(--good); background: var(--good-bg); } .warn-pill { color: var(--warn); background: var(--warn-bg); }
.bad-pill { color: var(--bad); background: var(--bad-bg); } .info-pill { color: var(--info); background: var(--info-bg); }
.muted-pill { color: var(--muted); border-color: var(--line); }
.todos { display: grid; gap: 6px; }
.todo { display: block; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--info); border-radius: 10px; padding: 10px 12px; }
.todo.warn { border-left-color: var(--warn); }
.todo:hover { text-decoration: none; border-color: var(--accent); }
.po-card { display: block; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.po-card:hover { text-decoration: none; border-color: var(--accent); }
.po-card b { display: block; margin-bottom: 4px; }
.reg-line { font-size: 13px; color: var(--muted); margin-top: 2px; } .reg-line b { display: inline; color: var(--ink); }
.unit { display: inline-block; min-width: 56px; color: var(--ink); }
.cust-list { display: grid; gap: 8px; }
.cust { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel2); }
.cust.new { border-left: 3px solid var(--warn); }
.cust-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cust-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
details { margin: 8px 0; } summary { cursor: pointer; }
.preview { margin-top: 10px; }

/* tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.compact td { padding: 6px 8px; }

/* PO lists and bill lists: rows on a wide screen, stacked cards on a phone */
.plist, .bills { display: grid; margin: 6px 0; font-size: 14px; }
.prow, .bill { display: grid; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line-soft); }
.prow { grid-template-columns: 26px minmax(130px, 1.4fr) repeat(3, minmax(72px, .8fr)) 86px 146px; }
.bill { grid-template-columns: 170px minmax(90px, 1fr) 90px minmax(170px, 1.4fr) 84px; }
.bills.units .bill { grid-template-columns: 170px minmax(90px, 1fr) 90px 118px minmax(170px, 1.4fr) 84px; }
.prow.head, .bill.head { color: var(--muted); font-size: 12.5px; padding-top: 2px; padding-bottom: 6px; }
.p-n { color: var(--muted); }
.b-veh { color: var(--muted); }
.b-unit select { padding: 5px 8px; border-radius: 8px; width: 100%; }
.b-act { justify-self: end; }
.lbl-sm { display: none; }
.prow.editing, .bill-editor { display: block; background: var(--panel2); border-radius: 10px; padding: 8px 12px; margin: 4px 0; }
.hide-sm { display: inline; }
@media (max-width: 640px) {
  .prow.head, .bill.head { display: none; }
  .prow { grid-template-columns: 20px 1fr 1fr 1fr auto; grid-template-areas: "n no no no st" "n al us le le" "n act act act act"; gap: 4px 8px; }
  .p-n { grid-area: n; align-self: start; } .p-no { grid-area: no; } .p-st { grid-area: st; justify-self: end; }
  .p-al { grid-area: al; } .p-us { grid-area: us; } .p-le { grid-area: le; }
  .p-al, .p-us, .p-le { text-align: left; font-size: 13px; }
  .p-act { grid-area: act; }
  .lbl-sm { display: inline; color: var(--muted); }
  .bill, .bills.units .bill { grid-template-columns: 1fr auto; grid-template-areas: "when qty" "veh act" "po act" "unit unit"; gap: 3px 10px; }
  .b-when { grid-area: when; } .b-qty { grid-area: qty; } .b-veh { grid-area: veh; font-size: 13px; }
  .b-po { grid-area: po; } .b-act { grid-area: act; align-self: center; } .b-unit { grid-area: unit; }
  .hide-sm { display: none; }
}

/* feedback */
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 18px 4px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; width: min(380px, calc(100% - 32px)); }
@media (max-width: 640px) { #toasts { right: 16px; bottom: 76px; } }
.toast { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--good); border-radius: 10px; padding: 10px 12px; box-shadow: 0 10px 30px #0008; }
.toast.bad { border-left-color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="center"><div class="loading"><span class="spinner"></span>Loading…</div></div></div>
<noscript><p style="padding:16px">The ledger app needs JavaScript.</p></noscript>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
