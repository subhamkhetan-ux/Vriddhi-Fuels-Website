name: Deploy tanker + tally apps to GitHub Pages

# Publishes ONLY the tanker bill app, the Tally voucher app (whose billing
# module reads the tanker app's assets and the same data file) and that one
# data file, plus the in-browser Tally import tools (tally-tools/), which bundle
# the bank/IOCL/fleet app code with the three lists they read: state/
# customers.json, bank_aliases.json and tally_ledgers.json. It does NOT publish
# the rest of the repo (beyond the static PDF Toolkit in pdf/) — importantly
# not the other state/ files (payment-agent
# queue / seen / bank data) or the Master Ledger.
#
# One-time: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions" (it is "Deploy from a branch" today — see below).

# Not run on push: this repo's Pages source is "Deploy from a branch" (main),
# which already serves every app (ledger/, tally/, tanker/, pdf/, tally-tools/
# …). Run on push, this narrower build raced that deploy and, when it
# finished last, replaced the whole site with just the folders above — the
# Ledger app (and tally/ledger-po.js, tally/daybook.js) then 404'd until the
# next push to main. Run it by hand only after switching Pages to
# "GitHub Actions", and first add everything the site needs to "Assemble site".
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (tanker + tally apps and their data only)
        run: |
          mkdir -p _site/tanker _site/tally _site/state
          cp tanker/index.html _site/tanker/index.html
          cp tanker/docx-export.js _site/tanker/docx-export.js
          cp -r tanker/assets _site/tanker/assets
          # Tally voucher app. Its billing module reuses /tanker/'s docx
          # builder, fonts and letterhead, and reads the same data file.
          cp tally/index.html tally/billing.js tally/slips.js tally/config.js tally/sw.js \
             tally/theme.css tally/theme.js tally/bridge.js tally/bridge.css tally/report-export.js \
             tally/manifest.webmanifest _site/tally/
          cp -r tally/vendor _site/tally/vendor
          cp "Vriddhi Fuels Logo.png" _site/               # app icon
          cp state/tanker_billing.json _site/state/tanker_billing.json
          # root redirect -> the app
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./tanker/">
          <title>Vriddhi Fuels — Tanker Billing</title>
          <a href="./tanker/">Open Tanker Billing</a> ·
          <a href="./tally/">Open Tally Vouchers</a> ·
          <a href="./pdf/">Open PDF Toolkit</a>
          HTML
          # PDF Toolkit: fully static and self-contained (vendored libraries)
          cp -r pdf _site/pdf
          # don't let Pages run Jekyll over the files
          touch _site/.nojekyll

      # Bank / IOCL / Fleet -> Tally, running entirely in the browser (Pyodide):
      # tally-tools/ plus the app code + templates + shipped ledger/customer/
      # alias lists it loads. (With Pages set to "Deploy from a branch" these are
      # already served from main; this keeps them working if Pages is switched
      # to "GitHub Actions".) Isolated: if this step fails the tanker + tally
      # apps above still deploy.
      - name: Add the in-browser Tally import tools (tally-tools/)
        continue-on-error: true
        run: python3 tally-tools/build.py site _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
