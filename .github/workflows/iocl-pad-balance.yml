name: IOCL e-Mitra PAD balance -> Payments

# Runs on the self-hosted Oracle Cloud runner in India (label `india`): the
# e-Mitra host drops connections from GitHub-hosted runners in the US/EU.
# Server setup: infra/india-runner/README.md.

on:
  schedule:
    # Every three hours. All cron expressions are UTC.
    - cron: "7 */3 * * *"
    # The day's opening: four tries inside 00:30–02:00 IST (the next local
    # day), at quiet minutes. GitHub starts scheduled runs late when it is
    # busy, worst on the hour: the old single 19:00 UTC run once started at
    # 04:39 IST and could no longer save the opening. A later try that finds
    # the opening saved stops before logging in.
    - cron: "3 19 * * *"    # 00:33 IST
    - cron: "23 19 * * *"   # 00:53 IST
    - cron: "43 19 * * *"   # 01:13 IST
    - cron: "8 20 * * *"    # 01:38 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Probe login page, validate without writing, or sync Payments"
        type: choice
        options: [network, probe, captcha-sample, dry-run, sync, opening]
        default: dry-run
      server:
        description: "Which India server runs it (india-a1: the new A1 while it is being tried)"
        type: choice
        options: [india, india-a1]
        default: india
  workflow_call:
    inputs:
      mode:
        type: string
        default: sync
    secrets:
      IOCL_EMITRA_USERNAME:
        required: false
      IOCL_EMITRA_PASSWORD:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: iocl-pad-balance
  cancel-in-progress: false

jobs:
  balance:
    # Enable after a real dry-run succeeds; no repeated logins with unverified
    # credentials/selectors. workflow_dispatch can always run a probe/dry-run.
    if: github.event_name == 'workflow_dispatch' || vars.IOCL_PAD_SYNC_ENABLED == 'true'
    runs-on: [self-hosted, "${{ inputs.server || 'india' }}"]
    timeout-minutes: 8
    env:
      # Created by infra/india-runner/setup.sh, owned by the runner user.
      AGENT_PY: /opt/agents/venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - name: Network reachability from this runner
        if: inputs.mode == 'network'
        run: |
          set +e
          host=utkarsh.indianoil.co.in
          echo "Runner egress location:"; curl -sS -m 10 https://ipinfo.io/json | grep -E '"(country|region|org)"'
          echo "DNS:"; getent ahosts "$host" | head -3
          for port in 443 80; do
            timeout 15 bash -c "</dev/tcp/$host/$port" && echo "TCP $port: open" || echo "TCP $port: no connection"
          done
          echo "HTTPS entry page:"; curl -sS -m 30 -o /dev/null -w '%{http_code} in %{time_total}s\n' "https://$host/ioconline/iocExStart.jsp"
          exit 0
      - name: Sync Python packages and browser
        if: inputs.mode != 'network'
        # System libraries and Tesseract are preinstalled by setup.sh; these are
        # no-ops when already current, so requirement bumps apply automatically.
        run: |
          "$AGENT_PY" -m pip install -q --disable-pip-version-check -r iocl_portal/requirements.txt
          "$AGENT_PY" -m playwright install chromium
      - name: Read company-code balance excluding open deliveries
        if: inputs.mode != 'network'
        env:
          IOCL_MODE: ${{ inputs.mode || (github.event.schedule && github.event.schedule != '7 */3 * * *' && 'opening' || 'sync') }}
          IOCL_EMITRA_USERNAME: ${{ secrets.IOCL_EMITRA_USERNAME }}
          IOCL_EMITRA_PASSWORD: ${{ secrets.IOCL_EMITRA_PASSWORD }}
          IOCL_CUSTOMER_CODE: ${{ vars.IOCL_CUSTOMER_CODE }}
          IOCL_CAPTCHA_LENGTH: ${{ vars.IOCL_CAPTCHA_LENGTH || '6' }}
          IOCL_SELECTORS_JSON: ${{ vars.IOCL_SELECTORS_JSON }}
          IOCL_SAMPLE_COUNT: ${{ vars.IOCL_SAMPLE_COUNT || '24' }}
          # Reuse the existing payment-agent bindings. If both are absent,
          # the runner uses the same published public config as /payments.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          case "$IOCL_MODE" in
            probe|captcha-sample|dry-run|sync|opening) "$AGENT_PY" -m iocl_portal.run "--$IOCL_MODE" ;;
            *) exit 2 ;;
          esac
      - name: Keep CAPTCHA samples for OCR tuning
        # Only the CAPTCHA pictures, the empty login page and OCR guesses:
        # nothing was typed, so no credentials or account data are inside.
        if: always() && inputs.mode == 'captcha-sample'
        uses: actions/upload-artifact@v4
        with:
          name: captcha-samples
          path: captcha-samples/
          retention-days: 3
          if-no-files-found: error
      - name: Print CAPTCHA samples to the log (for remote tuning)
        if: always() && inputs.mode == 'captcha-sample'
        run: |
          cat captcha-samples/report.json; echo
          for f in captcha-samples/captcha-*.png; do
            echo "B64 $(basename "$f") $(base64 -w0 "$f")"
          done
      - name: Report failed observation
        if: failure()
        run: |
          echo 'IOCL PAD sync failed. No successful observation was confirmed. Check the failing step; any earlier balance remains timestamped in Payments.' >> "$GITHUB_STEP_SUMMARY"
