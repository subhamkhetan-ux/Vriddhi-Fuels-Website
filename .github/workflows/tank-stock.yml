name: Tank stock (AnyDesk -> decant)

# Opens the IOCL automation PC with AnyDesk's unattended access from the India
# server and takes a screenshot of its tank stock screen. Stage 1: the picture
# goes privately to the XtraPower monitor's Telegram bot (this repo's logs are
# public). Setup: infra/anydesk/setup.sh and use-xtrapower-bot.sh on the
# server, then secrets ANYDESK_IDS and ANYDESK_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "capture: screenshot to Telegram; save-login: give the server's tank monitor the AnyDesk login"
        type: choice
        options: [capture, save-login]
        default: capture
      server:
        description: "Which India server runs it (india-a1: the new A1 while it is being tried)"
        type: choice
        options: [india, india-a1]
        default: india

permissions:
  contents: read

concurrency:
  group: tank-stock
  cancel-in-progress: false

jobs:
  stock:
    runs-on: [self-hosted, "${{ inputs.server || 'india' }}"]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture the tank stock screen, or save the login for the monitor
        env:
          # Both of the PC's AnyDesk numbers, comma separated: it alternates
          # between them and the job uses whichever is online.
          ANYDESK_IDS: ${{ secrets.ANYDESK_IDS }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: /opt/agents/venv/bin/python -m tank_stock.run --"$MODE"
